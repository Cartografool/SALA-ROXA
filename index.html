<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BULLET HELL</title>

    <link
      href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;

        display: flex;
        justify-content: center;
        align-items: center;

        overflow: hidden;

        font-family: "VT323", monospace;
      }

      body::before {
        content: "";

        position: fixed;
        inset: 0;

        background:
          linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)),
          url("background.png");

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;

        z-index: -1;
      }

      .crt-container {
        width: 900px;
        height: 650px;
        position: relative;
      }

      .crt {
        width: 100%;
        height: 100%;

        background: #000;

        border: 4px solid #9e2fc8;
        border-radius: 12px;

        overflow: hidden;

        box-shadow:
          0 0 20px #9e2fc8,
          0 0 50px rgba(91, 2, 255, 0.6);

        position: relative;
      }

      .scanlines,
      .flicker,
      .vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .scanlines {
        background: linear-gradient(
          to bottom,
          rgba(91, 2, 255, 0.02) 0%,
          rgba(91, 2, 255, 0.12) 50%,
          rgba(91, 2, 255, 0.02) 100%
        );

        background-size: 100% 4px;
      }

      .flicker {
        background: rgba(0, 0, 0, 0.05);
        animation: flicker 0.3s infinite;
      }

      .vignette {
        box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.9);
      }

      @keyframes flicker {
        0%,
        20%,
        100% {
          opacity: 0.1;
        }

        22% {
          opacity: 0.3;
        }

        30% {
          opacity: 0.6;
        }

        35% {
          opacity: 0.2;
        }
      }

      .menu {
        position: absolute;
        inset: 0;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        color: #9e2fc8;
        text-align: center;
      }

      .menu h1 {
        font-size: 80px;

        margin-bottom: 40px;

        text-shadow:
          0 0 10px #9e2fc8,
          0 0 30px #9e2fc8;
      }

      .menu p {
        font-size: 34px;
        margin: 8px 0;
      }

      .menu-message {
        margin-top: 25px;
        font-size: 24px;
      }

      .menu input {
        width: 180px;

        margin-top: 20px;

        background: rgba(91, 2, 255, 0.1);

        border: 2px solid #9e2fc8;

        color: #9e2fc8;

        text-align: center;

        font-family: "VT323", monospace;
        font-size: 26px;

        padding: 8px;
      }

      .menu input:focus {
        outline: none;
        box-shadow: 0 0 15px #9e2fc8;
      }

      .hidden {
        display: none !important;
      }

      .game {
        position: absolute;
        inset: 0;

        padding: 15px;

        display: flex;
        flex-direction: column;

        color: #9e2fc8;
      }

      .title {
        text-align: center;
        font-size: 34px;

        margin-bottom: 10px;

        text-shadow: 0 0 10px #9e2fc8;
      }

      .status {
        margin-top: 15px;

        display: flex;
        justify-content: space-between;

        font-size: 28px;
      }

      .seats {
        flex: 1;

        display: grid;

        grid-template-columns: repeat(5, 140px);
        grid-template-rows: repeat(2, 140px);

        justify-content: center;
        align-content: center;

        gap: 30px;

        margin: 0 auto;
      }

      .seat {
        background: transparent;
        border: none;
        padding: 0;

        cursor: pointer;

        display: flex;
        justify-content: center;
        align-items: center;

        transition: transform 0.15s;
      }

      .seat:hover {
        transform: scale(1.1);
      }

      .seat img {
        width: 140px;
        height: 140px;

        object-fit: contain;
        image-rendering: pixelated;
      }

      .seat:hover img {
        filter: drop-shadow(0 0 4px #9e2fc8) drop-shadow(0 0 8px #9e2fc8)
          drop-shadow(0 0 16px #9e2fc8) drop-shadow(0 0 24px #9e2fc8);
      }

      .dead img {
        filter: drop-shadow(0 0 4px #ff0048) drop-shadow(0 0 8px #ff0048)
          drop-shadow(0 0 16px #ff0048) drop-shadow(0 0 24px #ff0048);
      }

      .message {
        min-height: 60px;

        text-align: center;

        font-size: 28px;

        margin-top: 10px;
      }

      .game-over {
        color: #ff0048;

        text-shadow: 0 0 15px #ff0048;
      }
    </style>
  </head>

  <body>
    <div class="crt-container">
      <div class="crt">
        <div class="scanlines"></div>
        <div class="flicker"></div>
        <div class="vignette"></div>

        <div class="menu" id="menu">
          <h1>BULLET HELL</h1>

          <p>1 - INICIAR</p>
          <p>2 - INSTRUÇÕES</p>
        </div>
        <div class="menu hidden" id="instructions">
          <h1>INSTRUÇÕES</h1>

          <p>Você possui 6 balas.</p>
          <p>Existem 10 suspeitos.</p>
          <p>Clique em alguém para atirar.</p>
          <p>Descubra quem é o impostor.</p>

          <p style="margin-top: 40px">ESC - VOLTAR</p>
        </div>
        <div class="game hidden" id="game">
          <div class="title">IDENTIFIQUE O SUSPEITO</div>

          <div class="status">
            <span>
              BALAS:
              <span id="bullets">6</span>
            </span>

            <span> ALVOS: <span id="targets">10</span> </span>
          </div>

          <div class="seats" id="seats"></div>

          <div class="message" id="message">Escolha um alvo.</div>
        </div>
      </div>
    </div>

    <script>
      const menu = document.getElementById("menu");
      const game = document.getElementById("game");
      const instructions = document.getElementById("instructions");

      const seatsContainer = document.getElementById("seats");
      const bulletsText = document.getElementById("bullets");
      const targetsText = document.getElementById("targets");
      const message = document.getElementById("message");

      const gunshot = new Audio("sounds/shoot.mp3");

      let bullets = 6;
      let remainingTargets = 10;

      gunshot.volume = 0.8;

      document.addEventListener("keydown", (e) => {
        if (!menu.classList.contains("hidden")) {
          if (e.key === "1") iniciarJogo();
          if (e.key === "2") mostrarInstrucoes();
        } else if (!instructions.classList.contains("hidden")) {
          if (e.key === "Escape") esconderInstrucoes();
        }
      });

      function mostrarInstrucoes() {
        menu.classList.add("hidden");
        instructions.classList.remove("hidden");
      }

      function esconderInstrucoes() {
        instructions.classList.add("hidden");
        menu.classList.remove("hidden");
      }

      function iniciarJogo() {
        menu.classList.add("hidden");
        instructions.classList.add("hidden");
        game.classList.remove("hidden");

        bullets = 6;
        remainingTargets = 10;
        bulletsText.textContent = bullets;
        targetsText.textContent = remainingTargets;

        criarPoltronas();
      }

      function criarPoltronas() {
        seatsContainer.innerHTML = "";

        for (let i = 1; i <= 10; i++) {
          const seat = document.createElement("button");
          seat.className = "seat";
          seat.type = "button";

          const img = document.createElement("img");
          img.src = `sprites/pessoa${i}.png`;
          img.alt = `Pessoa ${i}`;

          seat.appendChild(img);
          seat.addEventListener("click", () => atirar(seat));

          seatsContainer.appendChild(seat);
        }
      }

      function atirar(seat) {
        if (seat.classList.contains("dead")) return;
        if (bullets <= 0) return;

        bullets--;
        remainingTargets--;

        bulletsText.textContent = bullets;
        targetsText.textContent = remainingTargets;

        gunshot.currentTime = 0;
        gunshot.play().catch(() => {});

        seat.classList.add("dead");
        const img = seat.querySelector("img");
        img.src = "sprites/morto.png";

        message.textContent = "ALVO ELIMINADO.";

        if (bullets <= 0) {
          message.innerHTML = `
          <span class="game-over">
            MUNIÇÃO ESGOTADA.<br>
            FIM DA SESSÃO.
          </span>
        `;

          document
            .querySelectorAll(".seat")
            .forEach((btn) => (btn.disabled = true));
        }
      }
    </script>
  </body>
</html>
