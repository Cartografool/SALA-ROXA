<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <title>SALA ROXA</title>

    <link
      href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        font-family: "VT323", monospace;
        background: #000;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)),
          url("background.png");
        background-size: cover;
        background-position: center;
        z-index: -1;
      }

      .crt-container {
        width: 900px;
        max-width: 100%;
        height: 650px;
        max-height: 95vh;
        position: relative;
        padding: 10px;
      }

      .crt {
        width: 100%;
        height: 100%;
        background: #000;
        border: 4px solid #9e2fc8;
        border-radius: 12px;
        overflow: hidden;
        box-shadow:
          0 0 20px #9e2fc8,
          0 0 50px rgba(91, 2, 255, 0.6);
        position: relative;
      }

      .scanlines,
      .flicker,
      .vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .scanlines {
        background: linear-gradient(
          to bottom,
          rgba(91, 2, 255, 0.02) 0%,
          rgba(91, 2, 255, 0.12) 50%,
          rgba(91, 2, 255, 0.02) 100%
        );
        background-size: 100% 4px;
      }

      .flicker {
        background: rgba(0, 0, 0, 0.05);
        animation: flicker 0.3s infinite;
      }

      .vignette {
        box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.9);
      }

      @keyframes flicker {
        0%,
        20%,
        100% {
          opacity: 0.1;
        }
        22% {
          opacity: 0.3;
        }
        30% {
          opacity: 0.6;
        }
        35% {
          opacity: 0.2;
        }
      }

      .menu,
      .game {
        position: absolute;
        inset: 0;
        padding: 20px;
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #9e2fc8;
        text-align: center;
      }

      .menu.active,
      .game.active {
        display: flex;
      }

      .menu h1 {
        font-size: 72px;
        margin-bottom: 40px;
        text-shadow:
          0 0 10px #9e2fc8,
          0 0 30px #9e2fc8;
      }

      .menu-option {
        font-size: 36px;
        margin: 12px 0;
        cursor: pointer;
        padding: 8px 30px;
        transition: all 0.2s;
      }

      .menu-option:hover,
      .menu-option:active {
        color: #fff;
        text-shadow: 0 0 20px #9e2fc8;
        transform: scale(1.1);
      }

      .game {
        flex-direction: column;
      }

      .title {
        text-align: center;
        font-size: 32px;
        margin-bottom: 10px;
        text-shadow: 0 0 10px #9e2fc8;
      }

      .status {
        margin: 10px 0 15px;
        display: flex;
        justify-content: space-between;
        font-size: 26px;
        width: 100%;
        max-width: 700px;
      }

      .seats {
        flex: 1;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 15px;
        justify-content: center;
        align-content: center;
        padding: 10px;
        width: 100%;
      }

      .seat {
        background: transparent;
        border: none;
        padding: 0;
        cursor: pointer;
        aspect-ratio: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: transform 0.15s;
      }

      /* Efeito roxo no PC (hover) */
      .seat:hover img {
        filter: drop-shadow(0 0 6px #9e2fc8) drop-shadow(0 0 12px #9e2fc8)
          drop-shadow(0 0 20px #9e2fc8) drop-shadow(0 0 30px #9e2fc8);
      }

      /* Efeito ao tocar no celular */
      .seat:active {
        transform: scale(1.15);
      }

      .seat img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        image-rendering: pixelated;
      }

      .dead img {
        filter: drop-shadow(0 0 6px #ff0048) drop-shadow(0 0 12px #ff0048)
          drop-shadow(0 0 20px #ff0048) drop-shadow(0 0 30px #ff0048);
      }

      .message {
        min-height: 50px;
        text-align: center;
        font-size: 26px;
        margin-top: 10px;
      }

      .game-over {
        color: #ff0048;
        text-shadow: 0 0 15px #ff0048;
      }

      /* Mobile adjustments */
      @media (max-width: 768px) {
        .crt-container {
          padding: 5px;
        }
        .menu h1 {
          font-size: 52px;
        }
        .menu-option {
          font-size: 28px;
        }
        .title {
          font-size: 26px;
        }
        .status {
          font-size: 22px;
        }
        .message {
          font-size: 22px;
        }
        .seats {
          gap: 12px;
        }
      }
    </style>
  </head>

  <body>
    <div class="crt-container">
      <div class="crt">
        <div class="scanlines"></div>
        <div class="flicker"></div>
        <div class="vignette"></div>

        <!-- MENU -->
        <div class="menu active" id="menu">
          <h1>SALA ROXA</h1>
          <div class="menu-option" id="start-btn">1 - INICIAR</div>
          <div class="menu-option" id="instructions-btn">2 - INSTRUÇÕES</div>
        </div>

        <!-- INSTRUÇÕES -->
        <div class="menu" id="instructions">
          <h1>INSTRUÇÕES</h1>
          <p>Você possui 6 balas.</p>
          <p>Existem 10 suspeitos.</p>
          <p>Toque em alguém para atirar.</p>
          <p>Descubra quem é o impostor.</p>
          <div class="menu-option" id="back-btn" style="margin-top: 40px">
            ESC - VOLTAR
          </div>
        </div>

        <!-- JOGO -->
        <div class="game" id="game">
          <div class="title">IDENTIFIQUE O SUSPEITO</div>

          <div class="status">
            <span>BALAS: <span id="bullets">6</span></span>
            <span>ALVOS: <span id="targets">10</span></span>
          </div>

          <div class="seats" id="seats"></div>

          <div class="message" id="message">Escolha um alvo.</div>
        </div>
      </div>
    </div>

    <script>
      const menu = document.getElementById("menu");
      const instructions = document.getElementById("instructions");
      const game = document.getElementById("game");

      const seatsContainer = document.getElementById("seats");
      const bulletsText = document.getElementById("bullets");
      const targetsText = document.getElementById("targets");
      const message = document.getElementById("message");

      const gunshot = new Audio("sounds/shoot.mp3");

      let bullets = 6;
      let remainingTargets = 10;

      gunshot.volume = 0.8;

      // Botões do menu
      document
        .getElementById("start-btn")
        .addEventListener("click", iniciarJogo);
      document
        .getElementById("instructions-btn")
        .addEventListener("click", mostrarInstrucoes);
      document
        .getElementById("back-btn")
        .addEventListener("click", esconderInstrucoes);

      // Teclado (PC)
      document.addEventListener("keydown", (e) => {
        if (menu.classList.contains("active")) {
          if (e.key === "1") iniciarJogo();
          if (e.key === "2") mostrarInstrucoes();
        } else if (instructions.classList.contains("active")) {
          if (e.key === "Escape") esconderInstrucoes();
        }
      });

      function mostrarInstrucoes() {
        menu.classList.remove("active");
        instructions.classList.add("active");
      }

      function esconderInstrucoes() {
        instructions.classList.remove("active");
        menu.classList.add("active");
      }

      function iniciarJogo() {
        menu.classList.remove("active");
        instructions.classList.remove("active");
        game.classList.add("active");

        bullets = 6;
        remainingTargets = 10;
        bulletsText.textContent = bullets;
        targetsText.textContent = remainingTargets;

        criarPoltronas();
      }

      function criarPoltronas() {
        seatsContainer.innerHTML = "";

        for (let i = 1; i <= 10; i++) {
          const seat = document.createElement("button");
          seat.className = "seat";
          seat.type = "button";

          const img = document.createElement("img");
          img.src = `sprites/pessoa${i}.png`;
          img.alt = `Pessoa ${i}`;

          seat.appendChild(img);
          seat.addEventListener("click", () => atirar(seat));

          seatsContainer.appendChild(seat);
        }
      }

      function atirar(seat) {
        if (seat.classList.contains("dead")) return;
        if (bullets <= 0) return;

        bullets--;
        remainingTargets--;

        bulletsText.textContent = bullets;
        targetsText.textContent = remainingTargets;

        gunshot.currentTime = 0;
        gunshot.play().catch(() => {});

        seat.classList.add("dead");
        const img = seat.querySelector("img");
        img.src = "sprites/morto.png";

        message.textContent = "ALVO ELIMINADO.";

        if (bullets <= 0) {
          message.innerHTML = `
          <span class="game-over">
            MUNIÇÃO ESGOTADA.<br>
            FIM DA SESSÃO.
          </span>
        `;
          document
            .querySelectorAll(".seat")
            .forEach((btn) => (btn.disabled = true));
        }
      }
    </script>
  </body>
</html>
